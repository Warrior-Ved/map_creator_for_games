<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16191f">
  <title>Map Creator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <button class="brand" id="btnMapTitle" title="Map settings">
      <svg viewBox="0 0 24 24" class="ico"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg>
      <span id="mapTitle">Untitled</span><span id="dirtyDot" title="Unsaved changes"></span>
    </button>
    <div class="tb-group">
      <button data-action="new" title="New map"><svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
      <button data-action="open" title="Open map"><svg viewBox="0 0 24 24" class="ico"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>Open</span></button>
      <button data-action="save" title="Save to PC (Ctrl+S)"><svg viewBox="0 0 24 24" class="ico"><path d="M5 3h11l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"/></svg><span>Save</span></button>
      <button data-action="export" title="Export for games"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v4h16v-4"/></svg><span>Export</span></button>
    </div>
    <div class="tb-group">
      <button data-action="undo" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" class="ico"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button data-action="redo" id="btnRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" class="ico"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="tb-group">
      <button data-action="generate" title="Generate terrain"><svg viewBox="0 0 24 24" class="ico"><path d="m3 20 6-10 4 6 3-4 5 8zM17 4l.8 1.7L19.5 6.5l-1.7.8L17 9l-.8-1.7-1.7-.8 1.7-.8z"/></svg><span>Generate</span></button>
      <button data-action="settings" title="Map settings"><svg viewBox="0 0 24 24" class="ico"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Map</span></button>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg">
      <button data-view="2d" class="on">2D</button>
      <button data-view="split">Split</button>
      <button data-view="3d">3D</button>
    </div>
    <button id="btnPanel" title="Show / hide side panel"><svg viewBox="0 0 24 24" class="ico"><path d="M3 4h18v16H3zM15 4v16"/></svg></button>
  </header>

  <main id="workspace">
    <nav id="toolbar">
      <button data-tool="select" title="Select & move (1)"><svg viewBox="0 0 24 24" class="ico"><path d="m5 3 14 8-6 2-2 6z"/></svg><span>Select</span></button>
      <button data-tool="pan" title="Pan (2) — or two fingers / right mouse"><svg viewBox="0 0 24 24" class="ico"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3 3 3m-3 17-3-3m3 3 3-3M2 12l3-3m-3 3 3 3m17-3-3-3m3 3-3 3"/></svg><span>Pan</span></button>
      <button data-tool="sculpt" title="Sculpt terrain (3)"><svg viewBox="0 0 24 24" class="ico"><path d="m2 20 7-11 4 6 2-3 7 8z"/></svg><span>Sculpt</span></button>
      <button data-tool="paint" title="Paint biomes (4)"><svg viewBox="0 0 24 24" class="ico"><path d="M18 3 9 12l3 3 9-9zM9 12c-3 0-5 2-5 5 0 2-1 3-2 4 4 0 9-1 9-4"/></svg><span>Paint</span></button>
      <button data-tool="place" title="Place objects (5)"><svg viewBox="0 0 24 24" class="ico"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Place</span></button>
      <button data-tool="scatter" title="Scatter objects (6)"><svg viewBox="0 0 24 24" class="ico"><path d="m6 3 2 5H4zM17 6l2 5h-4zM9 13l2 5H7zM18 15l2 5h-4z"/></svg><span>Scatter</span></button>
      <button data-tool="path" title="Roads, rivers, walls (7)"><svg viewBox="0 0 24 24" class="ico"><path d="M4 20c4-1 4-6 8-8s4-6 8-8"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/></svg><span>Paths</span></button>
      <button data-tool="region" title="Regions & quest zones (8)"><svg viewBox="0 0 24 24" class="ico"><path d="m4 7 7-4 9 5-2 10-9 3-5-6z"/></svg><span>Regions</span></button>
    </nav>

    <section id="viewports" class="mode-2d">
      <div id="view2d" class="viewport">
        <canvas id="canvas2d"></canvas>
        <div id="draftBar" class="floatbar hidden">
          <span id="draftInfo"></span>
          <button id="draftUndo">Undo point</button>
          <button id="draftCancel">Cancel</button>
          <button id="draftFinish" class="primary">Finish</button>
        </div>
        <div class="zoombar">
          <button data-zoom="in" title="Zoom in">+</button>
          <button data-zoom="out" title="Zoom out">−</button>
          <button data-zoom="fit" title="Fit map (F)">⤢</button>
        </div>
      </div>
      <div id="view3d" class="viewport">
        <div class="zoombar">
          <button id="btn3dWalk" title="Walk around in first person (starts at the selected object or the player spawn)">🚶</button>
          <button id="btn3dFrame" title="Frame whole map">⤢</button>
          <button id="btn3dFocus" title="Focus on selection">◎</button>
          <button id="btn3dShot" title="Save screenshot">📷</button>
        </div>
      </div>
    </section>

    <aside id="panel">
      <section class="pane" id="toolPane"></section>
      <section class="pane" id="propsPane"></section>
      <details class="pane" id="layersPane">
        <summary>Layers &amp; display</summary>
        <div id="layersBody"></div>
      </details>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="stCursor">—</span>
    <span id="stZoom"></span>
    <span id="stCounts"></span>
    <span class="spacer"></span>
    <span id="stSave"></span>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header><h2 id="modalTitle"></h2><button class="close" id="modalClose" aria-label="Close">✕</button></header>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="busy" class="hidden"><div class="spinner"></div><div id="busyText">Working…</div></div>
  <div id="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
